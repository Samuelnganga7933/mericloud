a{color:inherit;text-decoration:none}:focus-visible{outline:3px solid var(--ac);outline-offset:2px}

<div id="heroT"><div class="kick" style="color:#F5B27A">Software · AI automation · Networks · Legal tech</div><h1>The software behind how your business runs.</h1><p>We build, connect and maintain the systems that move an order, a case or a support email from start to finish.</p><button class="btn o" data-go="services">Explore services</button></div>
<div id="ring" style="opacity:0"><h2>Eight fields. Choose one.</h2></div><div id="hint">SCROLL TO ZOOM OUT</div></div></div>
<section class="sec"><div class="kick">How it works</div><h2 style="max-width:860px">Most business systems are the same few parts, built on purpose.</h2><p class="lead2">Whether it sells products, tracks legal cases or answers customers, a system like this has five layers. Knowing them makes it easier to judge any quote, including ours.</p><div class="arch"><div class="ar"><b>Where people use it</b><span>Website</span><span>Mobile app</span><span>Staff dashboard</span><span>Point of sale</span><span>WhatsApp and email</span></div><div class="ar core"><b>The core</b><span>API</span><span>Business rules</span><span>Permissions</span><span>Background jobs</span></div><div class="ar"><b>What it remembers</b><span>Database</span><span>File storage</span><span>Audit history</span></div><div class="ar"><b>What it connects to</b><span>Payments</span><span>Couriers</span><span>SMS and email</span><span>Accounting</span><span>AI models</span></div><div class="ar"><b>What keeps it standing</b><span>Cloud hosting</span><span>Network and VPN</span><span>Monitoring and alerts</span><span>Backups</span><span>Security controls</span></div></div>
<div class="g3"><div class="box"><h3>One core, many doors</h3><p>Your website, app and staff screens all talk to the same core. A price or stock change happens once and shows up everywhere.</p></div><div class="box"><h3>Connections, not copy-paste</h3><p>Payments, couriers, messaging and accounting are linked through APIs, so information moves by itself and every movement is recorded.</p></div><div class="box"><h3>Built to stay up</h3><p>Hosting, backups, monitoring and access control are designed in from the start, because that is what you rely on at 3 a.m.</p></div></div></section>
<section class="sec" style="padding-top:24px"><div class="kick">E-commerce</div><h2 style="max-width:820px">What we build for online and in-store selling.</h2><p class="lead2">A commerce system is a storefront, an order engine and a set of integrations. We build all three so a sale flows from checkout to delivery without anyone retyping it.</p><div class="two" style="margin-top:28px">${list("fl",FL.map(x=>x[0]),fl)}<div id="det">${stepDetail(FL,fl)}</div></div>
<h3 style="font-size:28px;margin:44px 0 0">How we build it</h3><div class="ph"><div><span>STEP 1</span><b>Scope the shop</b><p>Products, payment methods, delivery areas and how your team works today.</p></div><div><span>STEP 2</span><b>Build the core</b><p>Storefront, checkout and the order admin, released first so you can sell early.</p></div><div><span>STEP 3</span><b>Connect it</b><p>Payments, couriers, messaging and accounting wired in and tested on real orders.</p></div><div><span>STEP 4</span><b>Launch and run</b><p>Monitoring, backups and support, so the shop stays up on your busiest day.</p></div></div></section>
<section class="sec" style="background:var(--ib);max-width:none"><div style="max-width:1200px;margin:0 auto"><div class="kick">Working with us</div><h2 style="max-width:760px">Start small, decide with facts, own what you get.</h2><div class="g3"><div class="box"><h3>1 · Assessment</h3><p>A short conversation and a read of what exists. You get a written plan: what to build or fix, in what order, with an estimate. You decide whether to continue.</p></div><div class="box"><h3>2 · Build</h3><p>Small releases you can use and comment on, tested and deployed as we go. The code lives in your repository from the first day.</p></div><div class="box"><h3>3 · Run</h3><p>We stay on if you want: monitoring, fixes and changes. Or we hand over cleanly to your own team.</p></div></div>

const FAQ={Engagement:[["How do I know which service I need?","You do not have to. Describe what is slow, broken or missing, and we will tell you which part is software, which is process and which is neither. The assessment exists to answer that question before you commit to anything."],["Can Mericloud work with an existing system?","Yes. Most projects involve something that already exists: a spreadsheet, a website, a database, a tool the team likes. We read what is there first, then say what to keep, what to connect and what is cheaper to replace."],["Can I approach Mericloud with just an idea?","Yes. An early idea is the cheapest place to find problems. We help turn it into a clear description of what the system must do, who will use it and what the first useful version looks like."],["How does the initial consultation work?","It is a conversation about the problem, the people involved and the tools you use now. We ask a lot of questions. Afterwards we tell you whether we can help and what we would suggest as a next step. There is no obligation to continue."]],
Delivery:[["How long does a typical project take?","It depends on scope, how many systems must connect, how quickly decisions are made and how much data has to move. A focused automation can be much shorter than a platform with payments and delivery. After discovery you get a written plan with phases and estimates, not a guess on the first call."],["How are requirements established?","Through discovery: conversations with the people who use the system, a look at the documents and tools involved, and walking through real examples. The result is a written description that you approve before development starts."],["Will I be involved during development?","Yes, at set points. You see working releases, try them with real examples and tell us what is wrong. Your time matters most in discovery and when reviewing each release."],["How are changes handled?","Changes are normal. Each request is described, its effect on the plan is explained, and you decide whether to include it now, later or not at all."],["What happens before a system goes live?","Testing with real data, a check of permissions and backups, a rehearsal of the release and a plan for going back if something goes wrong. Staff are shown how to use it before customers are."]],
Technology:[["Can Mericloud integrate with third-party services?","Usually. Anything that offers an API, a webhook or a data export can be connected: payment providers, couriers, messaging platforms, accounting tools, CRMs. Where a service offers none, we say so early and discuss alternatives."],["Can existing data be migrated?","In most cases. We check the quality of the data first, because cleaning it is often the larger part of the job. Migrations are rehearsed on a copy before the real move."],["How is security considered during development?","From the start: separate accounts and roles, encrypted connections, safe storage of passwords and keys, logging of important actions and a review of what is exposed. The level of control is matched to the data the system holds."],["Can systems be expanded as the business grows?","That is a design aim. We separate the parts of a system so a new channel, branch or integration can be added without rebuilding what already works."]],
Support:[["What happens after deployment?","Launch is the start of the system's working life. Support depends on the agreement: monitoring, fixing faults, security updates and small improvements. We settle this before launch, so the question never arises at 3 a.m."],["Does Mericloud provide ongoing maintenance?","Yes, under a defined scope. If you would rather run the system yourselves, we hand it over with documentation and walk your team through it."],["Can Mericloud take over an existing application?","Yes. We begin with an assessment of the code, hosting and accounts, stabilise it, and then agree what ongoing support looks like."]],
Commercial:[["How are projects priced?","Price follows scope: how many workflows, how many integrations, how much data to migrate, how critical the system is and how much support it needs. After discovery you receive a written proposal. We do not quote blind."],["Is a consultation required before a proposal?","Yes, a short one. A proposal written without understanding the problem is a guess, and guesses are expensive for both sides."],["Can projects be delivered in phases?","Yes, and we usually recommend it. A first release that does one thing properly lets you use the system and learn before deciding on the rest."],["What should I prepare before contacting Mericloud?","Nothing formal. It helps to know the problem you want solved, who does the work today, which tools are involved and roughly what a good outcome would be. Examples help: a sample order, a spreadsheet, a screenshot."]]};

rcel on her phone.","parcel"]],["04","Money tracking","Every payment matched to its order.","Card, bank, wallet and cash payments are recorded against the order they belong to. Failed and duplicate payments are flagged. Refunds are tracked. At the end of the day the owner sees takings by channel, and the accountant receives an export instead of a shoebox of receipts.",["Card, bank and wallet payments through your provider's gateway, confirmed by its callback","Reconciliation of takings by channel and by day","Refunds and partial payments, recorded properly","Margin reporting and export to accounting tools"],["A payment summary on a mobile checkout screen.","chk","50% 80%","220%"]]];

>`};

const ART=[["Build, buy or connect: how to decide","Technology decisions",["Most businesses facing a software decision have three options, and the right one is rarely the one the first quote assumes.","Buy when the need is common. Accounting, email and basic payroll are solved problems, and custom software for them costs more without doing the job better.","Connect when the tools already exist but do not talk to each other. If staff copy data from one screen to another, the missing piece is usually a link, not a new system. An integration or an automation costs a fraction of a platform.","Build when the way you operate is your advantage: a delivery model, a pricing method or a case-handling process that competitors do not share. That deserves software that fits it exactly.","Three questions help. Is this process the same as everyone else's? What does the manual workaround cost each week? What happens if the vendor changes its pricing or its product?","If the answers are unclear, a short technical assessment is cheaper than choosing wrongly."],["cons","auto","software"]],["What an order tracking system actually tracks","E-commerce",["An order looks like one event. It is a chain: placed, paid, reserved from stock, picked, packed, handed to a courier, delivered, sometimes returned or refunded.","A tracking system records each link, who made it and when. That record answers the questions that otherwise cost an hour each: where is this order, who packed it, why is the stock count wrong, was it paid?","Four things need to be tracked together. Orders, with a status that only moves forward through a defined path. Stock, reserved at payment and reduced at dispatch. Deliveries, with updates from the courier or rider. Money, matched to the order it belongs to.","Tracked separately, they drift apart. Tracked in one system, they cannot disagree.","The practical test is simple: pick any order from last week and ask how long it takes to find its whole story."],["commerce","auto"]],["What to prepare before you contact a software company","Working with us",["You do not need a specification. You need a clear enough picture of the problem for a conversation to be useful.","Write down what is slow, broken or missing, in the words your team would use. Note who does the work today and how long it takes. List the tools involved, including spreadsheets and chat groups.","Gather examples: a typical order, a form, a screenshot of the screen that frustrates people. One real example is worth a page of description.","Decide what a good outcome looks like. Fewer errors, faster replies, one view of the stock: any of these is enough.","Be ready to talk about constraints: a deadline, a budget range, systems that cannot change, people who must approve.","If you cannot answer some of these, say so. Working it out together is part of the first conversation."],["cons","maint"]]];
